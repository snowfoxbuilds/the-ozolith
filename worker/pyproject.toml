[project]
name = "theozolith-worker"
version = "0.1.0"
description = "Coding-pipeline component: Worker + Reviewer actors (later milestones) and the repo bootstrap tool (label vocabulary + issue forms) that the pipeline substrate requires."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
theozolith-bootstrap = "theozolith_worker.bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theozolith_worker"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]
