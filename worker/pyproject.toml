[project]
name = "theozolith-worker"
version = "0.1.0"
description = "Coding-pipeline component: the Worker and Reviewer actors (poll-claim-run loop, Claim Protocol, first-party quality gate, best-effort PRs with Decisions Sections, review verdicts) plus the repo bootstrap tool (label vocabulary + issue forms) that the pipeline substrate requires."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
theozolith-bootstrap = "theozolith_worker.bootstrap.cli:main"
theozolith-worker = "theozolith_worker.worker:main"
theozolith-reviewer = "theozolith_worker.reviewer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theozolith_worker"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]
