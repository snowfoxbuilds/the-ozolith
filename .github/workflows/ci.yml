name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run pytest

  # The run-container image must always build (M2 brief: image rot is caught
  # here, not at the first Run on a box).
  run-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f worker/docker/Dockerfile.claude -t theozolith-run-claude:ci .

  # Same rule for the Control Node image (the `control` built-in Stack).
  control-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f control/docker/Dockerfile -t theozolith-control:ci .

  # The laptop-only user path (ADR-0007): knowledge/ must install and run
  # with zero dependencies on cluster components.
  knowledge-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install knowledge/ alone in a fresh venv
        run: |
          uv venv /tmp/iso
          uv pip install --python /tmp/iso/bin/python ./knowledge pytest
      - name: Run the knowledge tests against the isolated install
        run: /tmp/iso/bin/python -m pytest knowledge/tests
