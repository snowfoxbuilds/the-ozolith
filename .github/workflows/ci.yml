name: CI

# push is deliberately unfiltered: the secret-scan job must run on every
# branch and tag push (a credential on any ref is a leak), so no branch or
# path filter may narrow it.
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run pytest

  # The run-container image must always build (M2 brief: image rot is caught
  # here, not at the first Run on a box). buildx + a GitHub Actions layer cache
  # keeps the costly apt (node/npm) and npm-install layers warm across runs;
  # the image is neither loaded nor pushed — building it is the whole check.
  run-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/docker/Dockerfile.claude
          tags: theozolith-run-claude:ci
          cache-from: type=gha,scope=run-image
          cache-to: type=gha,mode=max,scope=run-image

  # Publish the base run image on merges to main (ADR-0051): the moving
  # :main tag every worker type and Flight Deck derives from, plus a
  # WRITE-ONCE :sha-<sha> for hand digest-pinning and rollback. A separate
  # job so `packages: write` never rides a job that runs on pull_request
  # or non-main pushes; the workflow trigger stays unfiltered (secret-scan
  # invariant above), so path relevance is decided inside the job. The
  # package stays private; each `theozolith config ingest` re-resolves the
  # tag to a digest (ADR-0048/0049), so fleets move bases only on ingest.
  #
  # Publication is MONOTONIC with main: registry writes are serialized by
  # the concurrency group below, and the moment before pushing, the run
  # re-resolves refs/heads/main — if the tip is no longer this run's
  # commit, a newer push owns the publication and this run skips (fail
  # closed: never push, never move :main backward). A commit tag, once
  # published, is never rebuilt or replaced: the write-once check answers
  # exists/absent/unknown, and "unknown" fails the job rather than
  # claiming immutability blind. On the first publication both tags are
  # pushed together, :sha-<sha> first (the immutable record), then :main
  # (the moving pointer) — an interruption between the two leaves :main
  # consistently old, and the next relevant push moves it.
  #
  # If a registry call 403s: the GHCR package must grant this repo access
  # (Package settings -> Manage Actions access) — a one-time step for a
  # package first created by a hand push.
  publish-run-image:
    needs: run-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize, never cancel: a running publication may be the current
    # tip's (job creation order can lag push order), so cancellation could
    # kill the one run that should publish. An obsolete run supersedes
    # ITSELF at the tip check instead. GitHub keeps at most one queued run
    # per group; in the rare reordering where the kept run is stale, it
    # self-skips and the next relevant push heals :main.
    concurrency:
      group: publish-run-image-main
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/snowfoxbuilds/theozolith-run-claude
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did anything the image is built from change?
        id: relevant
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Fail open on an unresolvable diff base (force-push, first
          # push): an extra image push is harmless, a silent skip is not.
          # (The write-once check below still keeps an existing commit tag
          # untouched even on this path.)
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
              worker/ knowledge/ .github/workflows/ci.yml)"
          else
            changed="unknown-diff-base"
          fi
          if [ -n "$changed" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Is the commit tag already published? (write-once)
        id: writeonce
        if: steps.relevant.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # sha-<sha> is write-once: the first successful publication is
          # authoritative, and a rerun/retry of this workflow must never
          # replace its digest with rebuilt bytes. Tri-state on the
          # manifest HEAD: 200 = exists (skip the whole build), 404 =
          # absent (first publication proceeds), anything else = unknown —
          # fail loudly rather than claim immutability blind.
          ref="sha-${GITHUB_SHA}"
          repo="${IMAGE#ghcr.io/}"
          token="$(curl -fsS -u "x:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')" || {
            echo "cannot mint a GHCR pull token to check ${ref} — refusing to publish blind" >&2
            echo "(first workflow publish on a hand-created package? grant this repo access" >&2
            echo " under Package settings -> Manage Actions access, then re-run)" >&2
            exit 1
          }
          code="$(curl -sS -o /dev/null -w '%{http_code}' --head \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repo}/manifests/${ref}")"
          case "$code" in
            200) echo "${ref} is already published — leaving its digest untouched (write-once)"
                 echo "fresh=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "fresh=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "cannot tell whether ${ref} exists (manifest HEAD answered HTTP ${code})" >&2
                 echo "— refusing to publish blind. If this is the first workflow publish," >&2
                 echo "grant this repo access to the package (Package settings -> Manage" >&2
                 echo "Actions access), then re-run." >&2
                 exit 1 ;;
          esac
      - if: steps.relevant.outputs.publish == 'true' && steps.writeonce.outputs.fresh == 'true'
        uses: docker/setup-buildx-action@v3
      # cache-from only: run-image already writes mode=max on this scope
      # every run, so this rebuild is fully warm and a second writer would
      # only thrash the scope. Built WITHOUT pushing (load into the local
      # daemon): the registry write happens in the guarded push step below,
      # after the tip check.
      - if: steps.relevant.outputs.publish == 'true' && steps.writeonce.outputs.fresh == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/docker/Dockerfile.claude
          push: false
          load: true
          tags: |
            ghcr.io/snowfoxbuilds/theozolith-run-claude:main
            ghcr.io/snowfoxbuilds/theozolith-run-claude:sha-${{ github.sha }}
          cache-from: type=gha,scope=run-image
      - name: Is this run still the tip of main? (monotonic publish)
        id: tip
        if: steps.relevant.outputs.publish == 'true' && steps.writeonce.outputs.fresh == 'true'
        run: |
          # Resolved from the live remote immediately before the registry
          # write: if main has advanced past this run's commit, the newer
          # push's run owns the publication — skipping is the fail-closed
          # choice (an obsolete run must never move :main backward or
          # publish its commit tag after being superseded).
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "$tip" ]; then
            echo "cannot resolve refs/heads/main on origin — refusing to publish blind" >&2
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale: main is now ${tip}, not ${GITHUB_SHA} — the newer push's run owns the publish"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.relevant.outputs.publish == 'true' && steps.writeonce.outputs.fresh == 'true' && steps.tip.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the commit tag, then move :main
        if: steps.relevant.outputs.publish == 'true' && steps.writeonce.outputs.fresh == 'true' && steps.tip.outputs.current == 'true'
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:main"

  # Same rule for the Control Node image (the hand-run compose flow —
  # control is never a Stack; ADR-0035). Cached the same way as run-image,
  # under its own scope so the two images never evict each other's layers.
  control-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: control/docker/Dockerfile
          tags: theozolith-control:ci
          cache-from: type=gha,scope=control-image
          cache-to: type=gha,mode=max,scope=control-image

  # The #31 spike harness's shell regression suite (stubbed docker/tailscale;
  # no engine, tailnet, or key needed): the out-of-band gate's credibility
  # rests on these checks, so the PR's green check must include them.
  spike-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n spikes/issue-31-tailscale-uid1000/run-spike.sh
      - run: sh -n spikes/issue-31-tailscale-uid1000/entrypoint.sh
      - run: spikes/issue-31-tailscale-uid1000/test-run-spike.sh

  # Secret scanning (the repo is public). This is post-push DETECTION and a
  # merge gate, not prevention: a credential a failed scan reports has
  # already reached GitHub. Recovery for a real leak is rotate the
  # credential immediately, THEN purge/rewrite history — rewriting alone is
  # not remediation. gitleaks runs on every branch/tag push and pull request
  # over every commit reachable from any ref (--all), including
  # merge-commit patches (--diff-merges=first-parent covers merge-resolution
  # content plain --all never diffs, without duplicating every parent's
  # patch). The pinned binary is used directly (gitleaks-action requires a
  # license for organization accounts) and checksum-verified in the repo's
  # hash-pinning spirit. The single rule-scoped exemption (the xterm.js
  # generic-api-key minifier false positive) lives in .gitleaks.toml;
  # .github/scripts/test-gitleaks.sh re-proves detection, the exemption's
  # exactness, and merge-commit coverage before the real scan runs.
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Regression-test the scanner and exemption
        run: .github/scripts/test-gitleaks.sh
      - name: Scan history of all refs, merge diffs included
        run: gitleaks git . --log-opts="--all --diff-merges=first-parent" --redact --no-banner

  # The laptop-only user path (ADR-0007): knowledge/ must install and run
  # with zero dependencies on cluster components. The docker-marked bake test
  # is deselected here — it runs once, in the full `test` job — so this job
  # doesn't rebuild the same image a second time.
  knowledge-isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install knowledge/ alone in a fresh venv
        run: |
          uv venv /tmp/iso
          uv pip install --python /tmp/iso/bin/python ./knowledge pytest
      - name: Run the knowledge tests against the isolated install
        run: /tmp/iso/bin/python -m pytest knowledge/tests -m "not docker"
