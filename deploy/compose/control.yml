# The Control Node, run directly with docker compose — the containerized
# reference flow. Control is never a Stack (ADR-0035: the substrate never
# supervises its own control plane), so this file is hand-run, never
# declared in the Config Repo or distributed to a node.
#
# First run (ADR-0023/0036) — one command generates the machine surface,
# then prints the operator handoff (the browser dashboard stays off until
# `origin-init`):
#
#   docker compose -f deploy/compose/control.yml build
#   docker compose -f deploy/compose/control.yml run --rm control init --ip <LAN-IP>
#   docker compose -f deploy/compose/control.yml up -d
#
# --ip is REQUIRED here: inside the container an auto-detected address would
# be the Docker bridge IP, so init refuses to guess (ADR-0031). Nodes AND
# browsers dial that IP directly (ADR-0034 — no DNS anywhere) — give this
# box a static IP or DHCP reservation.
#
# All state lands under ~/.theozolith/ on the host (ADR-0024), partitioned:
# configs/ (the git-backed Config Repo incl. control.toml), secrets/ (never
# in any git tree), cache/ (deletable), logs/. Backup = copy ~/.theozolith/
# minus cache/ to another device; recovery = restore + `run --rm control
# recover` (same IP: nodes reconnect untouched; new IP: one join-string
# re-paste per node). GitHub is never a full backup. There is no .env: tier-2 settings live in control.toml (edited in
# the dashboard), secrets in the encrypted store, and THEOZOLITH_* env vars
# remain expert overrides only.
#
# Provision nodes afterwards: `theozolith join-token create` prints the one
# paste per box (the join string rides the plaintext bootstrap listener's
# port below; the installer rides GitHub HTTPS).

services:
  control:
    build:
      context: ../..
      dockerfile: control/docker/Dockerfile
    image: theozolith-control:local
    restart: unless-stopped
    ports:
      # External 443 (the default control_port — the browser origin then
      # carries no port) mapped onto the container's Uvicorn bind (serve
      # --port, 8443). The two are independent: remapping the bind side
      # never changes the accepted browser Host/Origin — only the persisted
      # control address does (ADR-0034).
      - "443:8443"
      # The plaintext bootstrap listener (ADR-0023): exactly three public
      # values — CA cert, browser origin, canonical control URL. Nonstandard
      # remappings must ride the join string (control.toml bootstrap_port).
      - "6965:6965"
    environment:
      # The partitioned data dir inside the container; the volume below
      # makes ~/.theozolith on the host the real home.
      THEOZOLITH_DATA_DIR: /data
      # Optional pipeline identity (ADR-0017); without it the Control Node
      # is a pure substrate observer and dispatch answers 503.
      THEOZOLITH_REPO: ${THEOZOLITH_REPO:-}
      CONTROL_GITHUB_TOKEN: ${CONTROL_GITHUB_TOKEN:-}
    volumes:
      - ${THEOZOLITH_HOME:-~/.theozolith}:/data
