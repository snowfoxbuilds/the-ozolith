# The Control Node as the `control` built-in Stack (a container Stack).
# Run it directly for bootstrap (the Control Node must exist before any node
# can reconcile Stacks), or declare it in the Config Repo like any Stack.
#
# First run (ADR-0023) — one command generates everything, then prints the
# operator handoff (DNS line, CA download URL, per-OS trust one-liners):
#
#   docker compose -f deploy/compose/control.yml build
#   docker compose -f deploy/compose/control.yml run --rm control init
#   docker compose -f deploy/compose/control.yml up -d
#
# All state lands under ~/.theozolith/ on the host (ADR-0024), partitioned:
# configs/ (the git-backed Config Repo incl. control.toml), secrets/ (never
# in any git tree), cache/ (deletable), logs/. Backup = copy ~/.theozolith/
# minus cache/ to another device; recovery = restore + `run --rm control
# recover` + DNS update (nodes reconnect untouched). GitHub is never a full
# backup. There is no .env: tier-2 settings live in control.toml (edited in
# the dashboard), secrets in the encrypted store, and THEOZOLITH_* env vars
# remain expert overrides only.
#
# Provision nodes afterwards: `theozolith join-token create` prints the one
# paste per box (the join string rides the plaintext bootstrap listener's
# port below; the installer rides GitHub HTTPS).

services:
  control:
    build:
      context: ../..
      dockerfile: control/docker/Dockerfile
    image: theozolith-control:local
    restart: unless-stopped
    ports:
      # External 443 (the https default — the public origin then carries no
      # port) mapped onto the container's Uvicorn bind (serve --port, 8443).
      # The two are independent: remapping the bind side never changes the
      # accepted browser Host/Origin — only the origin artifact does.
      - "443:8443"
      # The plaintext bootstrap listener (ADR-0023): exactly three public
      # values — CA cert, public origin, canonical control URL. Nonstandard
      # remappings must ride the join string (control.toml bootstrap_port).
      - "6965:6965"
    environment:
      # The partitioned data dir inside the container; the volume below
      # makes ~/.theozolith on the host the real home.
      THEOZOLITH_DATA_DIR: /data
      # Optional pipeline identity (ADR-0017); without it the Control Node
      # is a pure substrate observer and dispatch answers 503.
      THEOZOLITH_REPO: ${THEOZOLITH_REPO:-}
      CONTROL_GITHUB_TOKEN: ${CONTROL_GITHUB_TOKEN:-}
    volumes:
      - ${THEOZOLITH_HOME:-~/.theozolith}:/data
