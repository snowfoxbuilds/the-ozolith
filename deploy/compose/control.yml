# The Control Node as the `control` built-in Stack (a container Stack).
# Run it directly for bootstrap (the Control Node must exist before any node
# can reconcile Stacks), or declare it in the Config Repo like any Stack.
#
# One-time provisioning (BEFORE the long-running service is healthy — until
# it is done, `serve` exits and the container restarts; that is expected):
#
#   docker compose -f deploy/compose/control.yml run --rm control origin-init
#     # mints the mandatory public origin (ADR-0019): one randomized
#     # https://<slug>.theozolith.internal origin (--base-domain to change;
#     # --port only for a nonstandard EXTERNAL port). Give its hostname a
#     # trusted-network-only DNS record; production serve requires the origin.
#   docker compose -f deploy/compose/control.yml run --rm control tls-init
#     # TLS is mandatory (secrets transit this channel); tls-init covers the
#     # public origin's hostname automatically. `--host <LAN name or IP>` adds
#     # extras.
#
# then start it and distribute the minted CA:
#
#   docker compose --env-file .env -f deploy/compose/control.yml up -d
#   docker compose -f deploy/compose/control.yml cp control:/data/tls/ca.pem .
# (install-nodedaemon.sh --ca ca.pem pins it on every node).
#
# Configuration comes from the environment (see deploy/.env.example).

services:
  control:
    build:
      context: ../..
      dockerfile: control/docker/Dockerfile
    image: theozolith-control:local
    restart: unless-stopped
    ports:
      # External 443 (the https default — the public origin then carries no
      # port) mapped onto the container's Uvicorn bind (serve --port, 8443).
      # The two are independent: remapping the bind side never changes the
      # accepted browser Host/Origin — only the origin artifact does.
      - "443:8443"
    environment:
      THEOZOLITH_NODE_TOKEN: ${THEOZOLITH_NODE_TOKEN:?set in .env}
      THEOZOLITH_ADMIN_TOKEN: ${THEOZOLITH_ADMIN_TOKEN:?set in .env}
      # The control PAT: required for the pipeline — the Control Node writes
      # every claim (ADR-0017) and runs the janitor. Unset = pure substrate
      # observer; claim dispatch answers 503 and the pipeline pauses.
      THEOZOLITH_REPO: ${THEOZOLITH_REPO:-}
      CONTROL_GITHUB_TOKEN: ${CONTROL_GITHUB_TOKEN:-}
      THEOZOLITH_ZOMBIE_GRACE_SECONDS: ${THEOZOLITH_ZOMBIE_GRACE_SECONDS:-600}
      THEOZOLITH_JANITOR_SWEEP_SECONDS: ${THEOZOLITH_JANITOR_SWEEP_SECONDS:-60}
      THEOZOLITH_ACTIVATION_WINDOW_SECONDS: ${THEOZOLITH_ACTIVATION_WINDOW_SECONDS:-60}
      THEOZOLITH_TAIL_BUDGET_BYTES: ${THEOZOLITH_TAIL_BUDGET_BYTES:-10737418240}
    volumes:
      # SQLite DB, master key, TLS material. The master key protects every
      # secret: this volume is the thing to back up and to guard.
      - control-data:/data
      # The Config Repo working home (ADR-0006), read-only in the container.
      - ${THEOZOLITH_CONFIG_REPO:-~/.theozolith/configs}:/configs:ro

volumes:
  control-data:
