# The Flight Deck as a thin Stack (ADR-0044): a driverless worker type
# (worker-types/flightdeck.toml) resolves to a container-kind Stack — the
# interactive, human-driven agent container and the web terminal's primary
# attach target (ADR-0019). The image, start command, volumes, and its
# dedicated no-merge machine-identity secret all live in the worker type.

worker_type = "flightdeck"
node = "box1"
state = "running"

# Web-terminal attach command, executed by the Control Node's PTY bridge as
# a structured argv array ({host}/{container} only as complete arguments,
# validated before launch). Attach and detach are audit-logged. `attach`
# lives on the Stack (a per-placement operator concern), and is only valid
# because the resolved kind is container.
attach = ["ssh", "{host}", "-t", "docker", "exec", "-it", "{container}", "tmux", "attach", "-t", "flightdeck"]

# Per-placement Stack env (ADR-0043). One Stack file per Flight Deck (no
# templating), so the tailnet hostname is a literal here. Convention:
# `flightdeck-<name>` — the name you reach in ONE hop as
# `ssh ozolith@flightdeck-box1` and via VSCode Remote-SSH (see
# deploy/configs-example/README.md). The worker type owns everything else; the
# `{stack}` volume placeholders resolve to this Stack's own name (`flightdeck`).
[env]
FLIGHTDECK_TS_HOSTNAME = "flightdeck-box1"
