# The Flight Deck as a thin Stack (ADR-0044): a driverless worker type
# (worker-types/flightdeck.toml) resolves to a container-kind Stack — the
# interactive, human-driven agent container and the web terminal's primary
# attach target (ADR-0019). The image, start command, volumes, and the
# default binding of its dedicated no-merge machine-identity secret all
# live in the worker type; bindings are rebindable per Stack (ADR-0047).

worker_type = "flightdeck"
node = "box1"
# Staged at "stopped": the worker-type ships the tailscale sha256 as a
# fail-closed placeholder that ingest refuses for a RUNNING Stack
# (ADR-0048) — paste the vendor's checksum, flip to "running", commit,
# ingest.
state = "stopped"

# Web-terminal attach command, executed by the Control Node's PTY bridge as
# a structured argv array ({host}/{container} only as complete arguments,
# validated before launch). Attach and detach are audit-logged. `attach`
# lives on the Stack (a per-placement operator concern), and is only valid
# because the resolved kind is container. One-hop tailnet SSH (below) is the
# direct path; this audited two-hop attach and the web terminal remain the
# fallback ways in.
attach = ["ssh", "{host}", "-t", "docker", "exec", "-it", "{container}", "tmux", "attach", "-t", "flightdeck"]

# One-hop target name on the tailnet (issue #31): with MagicDNS enabled,
# `ssh ozolith@flightdeck-box1` (or VSCode Remote-SSH to the same host) lands
# as ozolith inside THIS container. Per-placement by design — every Flight
# Deck Stack picks a distinct name, convention flightdeck-<something>.
[env]
FLIGHTDECK_TS_HOSTNAME = "flightdeck-box1"

# Per-instance enrollment hardening (ADR-0047): once THIS deck has enrolled
# successfully, unbind the auth key here — siblings still enrolling keep the
# type's default binding. (Keep this table last: everything below a [table]
# header belongs to it.)
# [secrets]
# TS_AUTHKEY = ""
