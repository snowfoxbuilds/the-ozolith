# The Control Node as the `control` built-in Stack: a container Stack like
# any other (the daemon has no hardcoded workload knowledge). Compose form;
# the file contents distribute over the channel as desired state, and
# overlays are the topology extension point (e.g. a tailscale sidecar).

kind = "container"
node = "pi"
state = "running"
compose = "compose/control.yml"
# overlays = ["overlays/tailscale.yml"]
