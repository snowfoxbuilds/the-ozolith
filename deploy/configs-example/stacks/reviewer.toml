# The Reviewer as a thin Stack (ADR-0044): its own worker type, its own
# GitHub identity — no self-grading by construction (ADR-0008). The driver,
# model, and default bindings live in worker-types/claude-review.toml;
# rebind `workspace` or `[secrets]` per Stack here (ADR-0047).

worker_type = "claude-review"
node = "box1"
# Staged at "stopped": point the worker-type's `workspace` at a real
# repository and enter the referenced secrets first — nothing deploys or
# builds until you flip to "running", commit, and ingest (ADR-0037/0048).
state = "stopped"
