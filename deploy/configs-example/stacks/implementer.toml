# The Implementer as a thin Stack (ADR-0044): worker type + placement +
# desired state, plus optional per-placement bindings (ADR-0047). The
# worker's identity — driver, adapter, model, run image — lives in the
# worker type (worker-types/claude-dev.toml); the Stack may rebind the
# target repo and the type's secret slots for THIS placement. Copy this
# tree into your Config Repo (default ~/.theozolith/configs on the Control
# Node) and adjust.
#
# No `attach` key: the resolved kind is process (the type has a driver), and
# run containers are headless and never attach targets (ADR-0019).
# Interactive work happens in the Flight Deck (stacks/flightdeck.toml).

worker_type = "claude-dev"
node = "box1"                # exact node name (THEOZOLITH_NODE_NAME)
# Staged at "stopped": point the worker-type's `workspace` at a real
# repository and enter the referenced secrets first — nothing deploys or
# builds until you flip to "running", commit, and ingest (ADR-0037/0048).
state = "stopped"

# Optional per-placement bindings (ADR-0047): repoint the target repo and
# rebind secret slots — how several Stacks of ONE type each work a different
# repository as their own machine account, no type cloning, no rebuild.
# workspace = "acme/other-repo"
# [secrets]
# GITHUB_TOKEN = "github-impl-box1"

# Optional [env] = per-placement expert overrides (they win over the values
# the worker type injects).
[env]
WORKER_ID = "worker-box1"
