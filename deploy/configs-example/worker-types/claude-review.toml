# The Reviewer worker type (ADR-0044): its own driver and — critically —
# its own GitHub identity, so no self-grading by construction (ADR-0008).
# It shares the Implementer's run-image recipe (same base/setup/knowledge),
# but a worker type is the complete unit: the driver and secrets differ, so
# it is a distinct type with a distinct derived-image name.

driver = "builtin:reviewer"      # the staged pipeline Reviewer (process kind)
adapter = "claude"
# The ADR-0008 "stronger model for review" rule lives HERE now: the model is
# a definition field baked into the derived image (ADR-0045) — the Reviewer
# driver itself ships no default and cannot select one at run time.
model = "claude-fable-5"
workspace = "acme/sandbox"

# Tag-only: ingest resolves and pins the digest (see claude-dev.toml).
base = "ghcr.io/snowfoxbuilds/theozolith-run-claude:main"

setup = [
    "apt-get update && apt-get install -y --no-install-recommends ripgrep && rm -rf /var/lib/apt/lists/*",
    "pip install --no-cache-dir uv",
]

# Shares the Implementer's knowledge tree (ADR-0048): same compiled bytes,
# same per-tree pin — editing the tree re-tags both types.
knowledge = "knowledge/claude-dev"

[secrets]
GITHUB_TOKEN = "github-reviewer"
# EITHER a workspace API key or a `claude setup-token` OAuth token (either
# authenticates the headless session; both may be set). Delete the unused line.
ANTHROPIC_API_KEY = "anthropic-api-key"
# CLAUDE_CODE_OAUTH_TOKEN = "anthropic-oauth-token"
