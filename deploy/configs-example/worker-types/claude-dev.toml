# The Implementer worker type (ADR-0044): the complete customization unit
# for one worker — the built-in Implementer driver, its Agent adapter and
# model, the target workspace, the secrets it needs, and the derived run
# image the container-host builds locally.
#
# The derived-image identity (tag = base tag + instruction hash) covers the
# bytes that build the image: base/setup/knowledge PLUS the materialized
# model/effort config (ADR-0045) — the bake writes a managed model default
# and effort pin into the image's managed settings, so changing either
# re-tags and rebuilds the image. driver/workspace/secrets still never
# trigger a rebuild. When you change the model, bump `base` to a release
# that ships theozolith-adapter in the same edit — both change the tag
# anyway. How the identity is held at runtime — best effort, main-agent
# scope, the documented gaps — is the comment block below and
# deploy/README.md.

driver = "builtin:implementer"   # the staged pipeline Implementer (process kind)
adapter = "claude"               # the Agent adapter the harness invokes
# model is REQUIRED with a driver and validated against the adapter at
# config load; a value the adapter cannot map refuses to load (ADR-0045).
# Pin the most-dated provider ID the adapter offers; family aliases
# (fable/haiku/opus/sonnet) load but warn; "default"/"opusplan" refuse to
# load (neither names a single checkable model). effort is optional
# ("" = the model's default), driver types only, and validated as a PAIR
# with the model: a level this model silently clamps or ignores (e.g.
# xhigh on the 4.6 generation, anything on haiku) refuses to load, as does
# any effort on a model whose capability the adapter does not positively
# know. The identity is held BY BEST EFFORT (ADR-0045): the bake writes a
# managed model DEFAULT for the MAIN agent (it outranks checkout/user
# settings; the harness passes no --model) plus a managed-env effort pin;
# subagents, skills routed through subagents, and background helpers stay
# FREE to use other models — enforcement is main-agent-only. The driver
# runs one identity dry-run container per boot (fails loud at setup, not
# per Run), each Run gets free static checks plus a fail-loud monitor
# that kills the session on a DETECTED off-identity main-agent turn or an
# identity-shaped mid-run settings change (failure_class "identity" with
# a stable category), and detection gaps are recorded in evidence, never
# blocking. The task session runs NORMALLY: the checkout's CLAUDE.md,
# skills, slash commands, settings, and hooks all load (deploy/README.md
# lists the accepted gaps, e.g. --model beats the default — nothing in
# the pipeline passes it).
# effort = "high"
model = "claude-sonnet-5"
workspace = "acme/sandbox"       # the repository (owner/name) it works

# Tag-only — `theozolith config ingest` resolves the tag to its digest and
# records it in the pinned build's pins.toml (ADR-0048): the Config Repo
# carries no computed pins. Appending @sha256:<digest> here stays legal for
# the cases where the digest IS the human decision — no registry access at
# ingest time, or holding a type on an older build than the tag points at.
base = "ghcr.io/snowfoxbuilds/theozolith-run-claude:main"

setup = [
    "apt-get update && apt-get install -y --no-install-recommends ripgrep && rm -rf /var/lib/apt/lists/*",
    "pip install --no-cache-dir uv",
]

# The knowledge/<name>/ tree in THIS Config Repo (ADR-0048): ingest compiles
# it (ADR-0009) and pins its content hash; the node bakes the compiled tree
# into the derived image at IMAGE BUILD time — never at container start.
# Editing the tree re-tags exactly the worker types that reference it.
knowledge = "knowledge/claude-dev"

# Secret NAMES only — values live encrypted on the Control Node, entered
# once via `theozolith secret set <name>`, pulled node-scoped at deploy
# time, and delivered as <ENV>_FILE from tmpfs (never node disk).
# Each entry is a SLOT (env name) -> default stored name; a Stack may rebind
# a slot per placement (distinct credentials per Stack), and "" declares a
# slot every instantiating Stack must bind (ADR-0047).
[secrets]
GITHUB_TOKEN = "github-implementer"
# Claude Code accepts EITHER a workspace API key or a subscription OAuth token
# from `claude setup-token` — supply whichever you have (both may be set). Map
# the one you use and `theozolith secret set <name>`; delete the other line.
ANTHROPIC_API_KEY = "anthropic-api-key"
# CLAUDE_CODE_OAUTH_TOKEN = "anthropic-oauth-token"
