# The recorded product version (ADR-0015 as amended 2026-07-22): the exact
# version the `update` infrastructure command installs on nodes — never
# deploy an unrecorded version. Normally written FOR you:
#
#   theozolith update              # pin the latest published release
#   theozolith update --version X  # pin an explicit release (rollback too)
#   theozolith build               # pin the local checkout's git SHA
#                                  # (-dirty when unclean) and serve wheels
#
# A fresh install with no pin resolves the latest release and writes one at
# Control Node startup, so a running fleet always has a recorded version.

[product]
version = "0.3.0"
