[project]
name = "theozolith-nodedaemon"
version = "0.1.0"
description = "Node Daemon: uncontainerized host daemon — heartbeat, command reconciliation, local builds, stack + driver supervision, run-container reaping. Stub; behavior lands in M3."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theozolith_nodedaemon"]

[dependency-groups]
dev = ["pytest>=8"]
