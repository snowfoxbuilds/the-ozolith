[project]
name = "theozolith-nodeagent"
version = "0.1.0"
description = "Node Agent: uncontainerized host daemon — heartbeat, command reconciliation, local builds, stack lifecycle. Stub in M1; behavior lands in a later milestone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theozolith_nodeagent"]

[dependency-groups]
dev = ["pytest>=8"]
