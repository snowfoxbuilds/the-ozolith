[project]
name = "theozolith-control"
version = "0.3.0"
description = "Control Node: heartbeat/command + typed-event API, claim pre-filter, zombie-claim janitor, retry auditor, and the encrypted node-scoped secret store. Advisory in coordination (ADR-0002); authoritative for node and docker lifecycle."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# The one component allowed runtime dependencies (ADR-0015 amending ADR-0010):
# it always ships as a container, so its footprint never lands on a host.
# theozolith-worker supplies the rate-limited GitHub client and the label
# vocabulary the janitor/auditor jobs need (pipeline-aware by design, ADR-0002).
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "cryptography>=42",
    # The dashboard (M4): server-rendered Jinja + vendored htmx/xterm.js
    # static files — no frontend build step exists (M4 acceptance 8).
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # starlette form parsing (login + secret form)
    "theozolith-worker",
]

[project.scripts]
theozolith-control = "theozolith_control.cli:main"
# The operator command (ADR-0015 amendment 2026-07-22): `theozolith update`
# pins a published release; `theozolith build` pins and serves the local
# source checkout. Both fan out over heartbeat responses.
theozolith = "theozolith_control.product:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theozolith_control"]

[tool.uv.sources]
theozolith-worker = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
