[project]
name = "theozolith-control"
version = "0.3.0"
description = "Control Node: heartbeat/command + typed-event API, claim pre-filter, zombie-claim janitor, retry auditor, and the encrypted node-scoped secret store. Advisory in coordination (ADR-0002); authoritative for node and docker lifecycle."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# The one component allowed runtime dependencies (ADR-0015 amending ADR-0010):
# it always ships as a container, so its footprint never lands on a host.
# theozolith-worker supplies the rate-limited GitHub client and the label
# vocabulary the janitor/auditor jobs need (pipeline-aware by design, ADR-0002).
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "cryptography>=42",
    # The dashboard (M4): server-rendered Jinja + vendored htmx/xterm.js
    # static files — no frontend build step exists (M4 acceptance 8).
    "jinja2>=3.1",
    "python-multipart>=0.0.9",  # starlette form parsing (login + secret form)
    # The Operator TUI (M9, ADR-0015 as amended by ADR-0040): `theozolith
    # top` is control/'s terminal surface — one component, one named
    # dependency, one stated purpose (the jinja2 precedent). worker/,
    # nodedaemon/, and knowledge/ remain stdlib-only.
    "textual>=1.0",
    "theozolith-worker",
    # `theozolith config ingest` runs the ADR-0009 knowledge compiler on the
    # Control Node (ADR-0048): compile at ingest, distribute compiled output.
    "theozolith-knowledge",
]

[project.scripts]
# The one human CLI (ADR-0032): service admin for this box (init/serve/…)
# plus the fleet-operator commands (update/build/test/join-token) that
# ADR-0015 introduced. `theozolith-control` is a deprecated alias.
theozolith = "theozolith_control.cli:main"
theozolith-control = "theozolith_control.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theozolith_control"]

[tool.uv.sources]
theozolith-worker = { workspace = true }
theozolith-knowledge = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=1"]
