[project]
name = "theozolith-control"
version = "0.1.0"
description = "Control Node: fleet dashboard, heartbeat/command + run-event API, janitor jobs. Stub in M1; behavior lands in a later milestone."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theozolith_control"]

[dependency-groups]
dev = ["pytest>=8"]
