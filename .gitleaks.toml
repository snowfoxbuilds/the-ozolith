# gitleaks configuration for TheOzolith.
#
# The repo is public. The secret-scan CI job is post-push DETECTION and a
# merge gate — by the time a scan fails, the credential has already reached
# GitHub (recovery: rotate first, then purge history; see ci.yml).
#
# This config inherits gitleaks' full built-in ruleset and adds exactly one
# rule-scoped exemption: the generic-api-key rule's false positive on the
# minifier artifact `t.TwoKeyMap=void` in the vendored xterm.js. The
# exemption is exact on (rule, path, extracted secret) — no file is ever
# globally exempt, every other rule (github-pat, private-key, ...) still
# applies to xterm.js, and any other generic-api-key match inside xterm.js
# still fails the scan. .github/scripts/test-gitleaks.sh proves all of this
# on every CI run.

title = "TheOzolith gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Exact xterm.js minifier false positive"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^t\.TwoKeyMap=void$''']
  paths = ['''^control/src/theozolith_control/web/static/xterm\.js$''']
